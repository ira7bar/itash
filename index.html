<!doctype html>
<html lang="he">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=yes" />
  <meta name="theme-color" content="#1c6e8c" />
  <title>תשחץ הארץ</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="app-row">
    <main id="grid-wrap">
      <div id="grid">
        <img id="puzzle-image" alt="" draggable="false" />
        <div id="overlay-layer"></div>
        <div id="celebration-overlay"></div>
        <div id="celebration-text">כל הכבוד!</div>
      </div>

      <div id="floating-controls">
        <button id="chat-toggle" type="button" hidden aria-expanded="false" aria-label="פתיחת הצ'אט">
          💬<span id="chat-badge" class="chat-badge" hidden>0</span>
        </button>
        <button id="draft-toggle" type="button" aria-pressed="false" aria-label="מצב טיוטה">✏️</button>
      </div>
    </main>

    <aside id="chat-panel" hidden>
      <div class="chat-handle"></div>
      <div class="chat-header">
        <span class="chat-title">צ'אט החדר</span>
        <button id="chat-close-btn" type="button" aria-label="סגירת הצ'אט">︿</button>
      </div>
      <div id="roster" class="roster"></div>
      <div id="chat-messages" class="chat-messages"></div>
      <form id="chat-form" class="chat-input-row">
        <input id="chat-input" type="text" placeholder="כתבו הודעה…" maxlength="500"
               autocomplete="off" autocorrect="off" spellcheck="false" />
        <button id="chat-send-btn" type="submit">שליחה</button>
      </form>
    </aside>
  </div>

  <div id="name-modal" class="modal-backdrop" hidden>
    <form id="name-form" class="modal-card">
      <h3>איך קוראים לך?</h3>
      <input id="name-input" type="text" placeholder="השם שיוצג לשאר החדר" maxlength="20"
             autocomplete="off" autocorrect="off" spellcheck="false" />
      <button type="submit">שמירה והמשך</button>
      <p class="modal-note">🔒 נשמר במכשיר הזה — יזכור אותך גם בפעם הבאה</p>
    </form>
  </div>

  <footer id="app-footer">
    <div class="footer-actions">
      <button id="clear-board-btn" type="button">נקה.י לוח</button>
      <button id="share-btn" type="button">משחק קבוצתי חדש</button>
      <button id="join-btn" type="button">הצטרפ.י לחדר</button>
      <button id="leave-room-btn" type="button" hidden>משחק אישי</button>
    </div>
    <p class="legal-note">
      המשחק מיועד למנויי העיתון בלבד, אנא <a href="https://promotion.haaretz.co.il/" target="_blank" rel="noopener noreferrer">תמכו בדמוקרטיה ורכשו מנוי</a>
    </p>
  </footer>

  <input id="hidden-input" type="text" inputmode="text" lang="he" autocomplete="off"
         autocapitalize="off" autocorrect="off" spellcheck="false" />

  <script type="module" src="src/main.js"></script>
</body>
</html>
