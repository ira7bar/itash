<!doctype html>
<html lang="he">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=yes" />
  <meta name="theme-color" content="#1c6e8c" />
  <title>תשחץ הארץ</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main id="grid-wrap">
    <div id="grid">
      <img id="puzzle-image" alt="" draggable="false" />
      <div id="overlay-layer"></div>
    </div>
  </main>

  <footer>
    <button id="share-btn" type="button">משחק קבוצתי</button>
    <button id="leave-room-btn" type="button" hidden>משחק אישי</button>
    <div id="room-code" hidden></div>
    <form id="join-form">
      <input id="join-code-input" type="text" inputmode="text" placeholder="קוד חדר" maxlength="8"
             autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" />
      <button id="join-btn" type="submit">הצטרף</button>
    </form>
  </footer>

  <input id="hidden-input" type="text" inputmode="text" lang="he" autocomplete="off"
         autocapitalize="off" autocorrect="off" spellcheck="false" />

  <script type="module" src="src/main.js"></script>
</body>
</html>
